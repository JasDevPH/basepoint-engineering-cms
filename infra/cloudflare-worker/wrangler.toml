name = "bp-bot-prerender-v2"
main = "bot-prerender-worker.js"
compatibility_date = "2026-08-28"

# Catch-all route (not basepointengineering.com/*) — this zone is an
# Orange-to-Orange setup (Webflow's origin is itself behind its own Cloudflare
# account), and Cloudflare has a known bug where specific-hostname Route
# patterns silently fail to dispatch on O2O zones; only catch-all patterns
# reliably match. Hostname scoping is done in bot-prerender-worker.js instead.
# See: https://github.com/cloudflare/workers-sdk/issues/11270
routes = [
  { pattern = "*basepointengineering.com/*", zone_name = "basepointengineering.com" },
]

# Set with: wrangler secret put PRERENDER_TOKEN
# [vars] section intentionally omitted — PRERENDER_TOKEN must be a secret, not a plaintext var.
